name: Publish to PyPI

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for Trusted Publisher (OIDC)

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Validate package
        run: twine check --strict dist/*

      - name: Verify wheel installs
        run: |
          python -m venv /tmp/terag-check
          /tmp/terag-check/bin/python -m pip install dist/*.whl
          /tmp/terag-check/bin/python -c "from terag import TERAG, TERAGConfig; print('OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Option A: Trusted Publisher (preferred, no secret needed)
      # Set up at https://pypi.org/manage/project/terag/settings/publishing/
      - name: Publish (Trusted Publisher)
        if: env.USE_TRUSTED_PUBLISHER == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      # Option B: API token (current setup)
      - name: Publish (API token)
        if: env.USE_TRUSTED_PUBLISHER != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
